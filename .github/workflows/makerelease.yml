name: build and release non-LLVM deps

on:
  workflow_dispatch:
    inputs:
      skip-release:
        type: boolean
        description: Skip release creation? For build testing
        default: false

jobs:
  buildlinux:
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            plat_machine: x86_64
          - runner: ubuntu-24.04-arm
            plat_machine: aarch64
    runs-on: ${{ matrix.runner }} 
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git commit timestamp
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build Linux deps
        run: |
          cd thirdparty-linux
          mkdir -p out/bin
          mkdir -p out/lib
          mkdir -p out/include
          for x in $(ls */build*.sh); do
            bash $x
          done

          mv out xj-build-deps 
          tar caf xj-build-deps_${{ matrix.plat_machine }}.tar.xz xj-build-deps 

          tar caf xj-bullseye-sysroot-extras_${{ matrix.plat_machine }}.tar.xz \
                   debian-bullseye_gcc_glibc/${{ matrix.plat_machine }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat_machine }} 
          path: thirdparty-linux/*.tar.xz

  buildcrossplat:
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        include:
          - runner: ubuntu-latest
            plat_machine: linux-x86_64
          - runner: ubuntu-24.04-arm
            plat_machine: linux-aarch64
          - runner: macos-14
            plat_machine: macos-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container Registry
        if: ${{ startsWith(matrix.runner, 'ubuntu') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ccache (on mac, since ubuntu runs builds in docker)
        if: ${{ startsWith(matrix.runner, 'macos') }}
        uses: hendrikmuhs/ccache-action@30ae3502c7f2d3200209bf2f90eccef2357896cf
        with:
          key: ${{ github.job }}-${{ matrix.runner }}

      - name: Get Git commit timestamp
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build cross-platform deps
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cd thirdparty-crossplat
          mkdir -p out/bin
          mkdir -p out/lib
          mkdir -p out/include
          for x in $(ls */build*.sh); do
            bash $x
          done

          mv out xj-more-deps
          tar caf xj-more-deps_${{ matrix.plat_machine }}.tar.xz xj-more-deps
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plat_machine }}
          path: thirdparty-crossplat/*.tar.xz

      - name: Test cc2json
        if: ${{ startsWith(matrix.runner, 'ubuntu') }}
        run: |
          wget https://github.com/Aarno-Labs/tenjin-build-deps/releases/download/llvmorg-14.0.6/LLVM-14.0.6-$(uname -s)-$(uname -m | sed 's/arm64/aarch64/').tar.xz
          tar xf LLVM-*.tar.xz
          rm     LLVM-*.tar.xz
          mv LLVM-* xj-llvm-14

          echo '#include <stdio.h>' >> hello.c
          echo 'int main() { printf("hello\n"); return 0; }' >> hello.c
          ./xj-llvm-14/bin/clang -c -emit-llvm hello.c
          LD_LIBRARY_PATH=$PWD/xj-llvm-14/lib ./thirdparty-crossplat/xj-more-deps/bin/cc2json-llvm14 hello.bc --datalog-analysis=unification --debug-datalog=false --context-sensitivity=insensitive --json-out=hello.cclyzer.json

  release:
    needs: [buildlinux, buildcrossplat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true  # otherwise, we'd get each platform's tarball in separate directories

      - name: Get short hash
        run: echo "SHORTHASH=$(echo ${{ github.sha }} | cut -c1-9)" >> $GITHUB_ENV

      - name: Emit job summary
        run: |
          echo "- shorthash is $SHORTHASH" >> $GITHUB_STEP_SUMMARY
          echo "- skipped release: ${{ inputs.skip-release }}" >> $GITHUB_STEP_SUMMARY

      - name: Create Release via gh
        if: ${{ ! inputs.skip-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
              rev-${{ env.SHORTHASH }} \
              --notes "release for rev ${{ github.sha }}" \
              --target ${{ github.sha }} \
              *.tar.xz

